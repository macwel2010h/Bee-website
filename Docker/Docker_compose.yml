version: "3.8"

services:
  web:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    ports:
      - "8080:80"
    volumes:
      - ../:/var/www/html
    environment:
      DB_HOST: db
      DB_NAME: the_website_db
      DB_USER: root
      DB_PASSWORD: Abcd@1234
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: Abcd@1234
      MYSQL_DATABASE: the_website_db
    ports:
      - "3306:3306"
    volumes:
      - ../SQL/database.sql:/docker-entrypoint-initdb.d/database.sql:ro
