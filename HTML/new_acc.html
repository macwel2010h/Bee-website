			content="width=device-width, initial-scale=1.0"
		/>
		<title>the_website</title>
		<link
			href="../CSS/main.css"
			rel="stylesheet"
		/>
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"

	<body>
		<header>New account creation</header>
		<form
			action="../php/new_user.php"
			method="POST"
		>
			<fieldset>
				<legend>Enter your details</legend>
				<label
					>First Name:
					<input
						type="text"
						name="first_name" /></label
				><br />
				<label
					>Last Name:
					<input
						type="text"
						name="last_name" /></label
				><br />
				<label
					>Middle Name:
					<input
						type="text"
						name="middle_name" /></label
				><br />
				<label
					>User Name:
					<input
						type="text"
						name="username" /></label
				><br />
				<label
					>Email :
					<input
						type="text"
						name="email" /></label
				><br />
				<label
					>Password :
					<input
						type="text"
						name="password" /></label
				><br />
				<button type="submit">Create account</button>
			</fieldset>
		</form>
