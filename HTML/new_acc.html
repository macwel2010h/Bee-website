	<head>
		<meta charset="UTF-8" />
		<meta

			content="width=device-width, initial-scale=1.0" />
		<title>the_website</title>
		<link
			href="../CSS/main.css"
			rel="stylesheet" />
		<link
			href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
			rel="stylesheet"
			integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
			crossorigin="anonymous" />
	</head>
	<body class="d-flex flex-column min-vh-100 bg_img">
		<div class="d-flex flex-column justify-content-center align-items-center flex-grow-1 mt-5">
			<div
				class="card shadow-lg p-4 bg-body-tertiary rounded"
				style="width: 60%; max-width: 700px">
				<div class="d-flex flex-column justify-content-center align-items-center flex-grow-1 mb-5">
					<img
						src="../rsc/nav_logo.svg"
						width="120"
						height="80"
						class="rounded mx-auto d-block"
						alt="The Bee-Hive" />
					<h3>The Bee-Hive</h3>
				</div>
				<form
					class="w-100 mb-5 needs-validation"
					action="../php/new_user.php"
					method="POST">
					<div class="row mb-3">
						<div class="col">
							<label
								for="first_name"
								class="form-label"
								>First Name :</label
							>
							<input
								type="text"
								name="first_name"
								class="form-control"
								required />
						</div>

						<div class="col mb-3">
							<label
								for="last_name"
								class="form-label"
								>Last Name :</label
							>
							<input
								type="text"
								name="last_name"
								class="form-control"
								required="yes" />
						</div>
					</div>
					<div class="row mb-3">
						<div class="col">
							<label
								for="email"
								class="form-label"
								>Email :</label
							>
							<input
								type="email"
								name="email"
								class="form-control"
								required="yes" />
						</div>
					</div>
					<div class="row mb-5">
						<div class="col">
							<label
								for="username"
								class="form-label"
								>Username :</label
							>
							<input
								type="text"
								name="username"
								class="form-control"
								required="yes" />
						</div>
						<div class="col">
							<label
								for="password"
								class="form-label"
								>Password :</label
							>
							<input
								type="password"
								name="password"
								class="form-control"
								required="yes" />
							<div
								id="passwordHelpBlock"
								class="form-text">
								Your password must be 8-20 characters long, contain letters and numbers.
							</div>
						</div>
					</div>

					<button
						type="submit"
						class="btn btn-warning w-100">
						Create account
					</button>
				</form>
				<div class="d-flex flex-column justify-content-center align-items-center flex-grow-1">
					<p>Already have an account?</p>
					<a href="../index.html"><button class="btn btn-warning">log in</button></a>
				</div>
			</div>
		</div>
		<footer class="py-3 my-4">
			<ul class="nav justify-content-center border-bottom pb-3 mb-3">
				<li class="nav-item">
					<a
						href="#"
						class="nav-link px-2 text-body-secondary"
						>Home</a
					>
				</li>
				<li class="nav-item">
					<a
						href="#"
						class="nav-link px-2 text-body-secondary"
						>Features</a
					>
				</li>
				<li class="nav-item">
					<a
						href="#"
						class="nav-link px-2 text-body-secondary"
						>Pricing</a
					>
				</li>
				<li class="nav-item">
					<a
						href="#"
						class="nav-link px-2 text-body-secondary"
						>FAQs</a
					>
				</li>
				<li class="nav-item">
					<a
						href="#"
						class="nav-link px-2 text-body-secondary"
						>About</a
					>
				</li>
			</ul>
			<p class="text-center text-body-secondary">&copy; 2025 Company, Inc</p>
		</footer>
	</body>
</html>
