	<body class="d-flex flex-column min-vh-100 bg_img">
		<div class="d-flex flex-column justify-content-center align-items-center flex-grow-1">
			<div
				class="card shadow-lg p-4 bg-body-tertiary rounded"
				style="width: 60%; max-width: 600px">
				<div class="d-flex flex-column justify-content-center align-items-center flex-grow-1 mb-5">
					<img
						src="rsc/nav_logo.svg"
						width="120"
						height="80"
						class="rounded mx-auto d-block"
						alt="The Bee-Hive" />
					<h3>The Bee-Hive</h3>
				</div>

				<form
					class="w-100 mb-5 needs-validation novalidate"
					method="POST"
					action="php/sign_in.php">
					<div class="mb-3">
						<label
							for="email"
							class="form-label"
							>Email or Username :
						</label>
						<input
							type="text"
							name="email"
							class="form-control"
							placeholder="name@example.com"
							required />
					</div>
					<div class="mb-5">
						<label
							for="password"
							class="form-label"
							>Password :
						</label>
						<input
							type="password"
							name="password"
							class="form-control"
							aria-describedby="passwordHelpBlock"
							required />
					</div>
					<button
						class="btn btn-warning w-100"
						type="submit">
						Log In
					</button>
				</form>
				<div class="d-flex flex-column justify-content-center align-items-center flex-grow-1">
					<p>Do not have an account?</p>
					<a href="HTML/new_acc.html"><button class="btn btn-warning">Register</button></a>
				</div>
			</div>
		</div>
